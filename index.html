<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style><title>C3 Corvette Håndbok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky verktøylinje med faner, årstall-stripe, deretter innhold i én kolonne (maks 1080px). Tachometer-stripe viser rødmerking. */
:root{
  --paper:#ECEEEA; --panel:#F8F9F6; --ink:#14202B; --muted:#586670; --line:#CDD3CD;
  --hl-sb:#2E7D4F; --hl-82:#7B4FA3; --hl-bb:#C2570C; --red:#B01E2B; --blue:#1D5C8F; --ochre:#8F6210; --track:#9FB0BA; --chip:#DDE2DC;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F151B; --panel:#17202A; --ink:#E7ECEF; --muted:#9AA9B4; --line:#2A3844;
    --hl-sb:#5CC98A; --hl-82:#B995E0; --hl-bb:#F59A5A; --red:#F0575D; --blue:#69B0E6; --ochre:#E0A94A; --track:#3B4B58; --chip:#1F2A35; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F151B; --panel:#17202A; --ink:#E7ECEF; --muted:#9AA9B4; --line:#2A3844;
  --hl-sb:#5CC98A; --hl-82:#B995E0; --hl-bb:#F59A5A; --red:#F0575D; --blue:#69B0E6; --ochre:#E0A94A; --track:#3B4B58; --chip:#1F2A35; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:18px 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.mast{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid var(--ink)}
.mast h1{font-size:clamp(44px,9vw,84px);text-transform:uppercase}
.mast h1 span{color:var(--red)}
.mast p{margin:0;max-width:44ch;color:var(--muted);font-size:14px}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line)}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:2px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.nav button[aria-selected="true"]{border-bottom-color:var(--red)}
.nav button:hover{background:var(--chip)}

.years{display:flex;gap:6px;overflow-x:auto;padding-block:14px 6px}
.years button{flex:0 0 auto;min-width:52px;border:1px solid var(--line);background:var(--panel);padding:6px 8px 4px;text-align:center;border-radius:2px}
.years button b{display:block;font-family:var(--f-display);font-size:26px;line-height:1}
.years button small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.years button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.years button[aria-pressed="true"] small{color:var(--paper)}

.yhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:end;padding-block:18px 8px}
.yhead h2{font-size:clamp(56px,13vw,120px);color:var(--red)}
.yhead .nm{font-family:var(--f-display);font-size:24px;font-weight:700;text-transform:uppercase}
.yhead .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.lead{max-width:68ch;margin:6px 0 4px;font-size:16px}
.pn{display:flex;gap:8px;margin-block:10px}
.pn button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:2px}
.pn button:disabled{opacity:.4;cursor:default}

section.blk{margin-top:30px}
section.blk>h3{font-size:30px;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
section.blk>h3 small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0}
ul.l{margin:0;padding-left:1.1em;display:grid;gap:6px;max-width:80ch}
ul.l li::marker{color:var(--red)}

.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--chip);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
td .code{font-weight:600}
td .sub{display:block;color:var(--muted);font-size:12px}
.tach{display:block;width:120px;height:8px;margin-top:4px;background:linear-gradient(90deg,var(--track) var(--p),var(--red) var(--p))}
.rpm{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.pill.man{color:var(--blue)} .pill.aut{color:var(--ochre)} .pill.unk{color:var(--muted)}

.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.three h4{margin:0 0 8px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;border-top:3px solid var(--red);padding-top:6px}
@media (max-width:820px){.three{grid-template-columns:minmax(0,1fr)}.yhead{grid-template-columns:minmax(0,1fr)}.yhead .meta{text-align:left}}

.note{border-left:4px solid var(--ochre);background:var(--panel);padding:10px 14px;max-width:80ch;margin-block:12px;font-size:14px}
.note b{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}

.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-block:16px}
.ctl input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:2px;font:inherit}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{border:0;background:var(--panel);padding:8px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.bar .lab{line-height:1.2}
.bar .lab small{display:block;color:var(--muted);font-size:11px}
.bar .tr{height:16px;background:var(--chip);position:relative}
.bar .fl{position:absolute;inset:0 auto 0 0}
.bar .fl.man{background:var(--blue)} .bar .fl.aut{background:repeating-linear-gradient(135deg,var(--ochre) 0 6px,transparent 6px 9px);outline:1px solid var(--ochre);outline-offset:-1px} .bar .fl.unk{background:var(--muted)}
.bar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.bar{grid-template-columns:96px minmax(0,1fr) 54px;gap:6px;font-size:12px}}

.tl{display:grid;gap:0}
.tl details{border-top:1px solid var(--line);padding-block:10px}
.tl summary{cursor:pointer;display:flex;gap:14px;align-items:baseline;list-style:none}
.tl summary::-webkit-details-marker{display:none}
.tl summary b{font-family:var(--f-display);font-size:34px;color:var(--red);min-width:70px}
.tl details[open] summary{margin-bottom:8px}
.src li{margin-bottom:4px;word-break:break-word}
.small{font-size:12.5px;color:var(--muted)}
.pill.k-src{color:var(--blue)} .pill.k-gen{color:var(--muted)}
.gl{display:grid;gap:0}
.gl details{border-top:1px solid var(--line);padding-block:10px}
.gl summary{cursor:pointer;font-weight:600;font-size:16px}
.gl details[open] summary{margin-bottom:8px}
.steps{padding-left:22px;max-width:75ch} .steps li{margin-bottom:6px}
.hl-sb{--hl:var(--hl-sb)} .hl-82{--hl:var(--hl-82)} .hl-bb{--hl:var(--hl-bb)}
tr[class^="hl-"]>td{background:color-mix(in srgb,var(--hl) 14%,var(--panel))}
tr[class^="hl-"]>td:first-child{box-shadow:inset 5px 0 0 var(--hl)}
.hlkey{display:flex;gap:8px 16px;flex-wrap:wrap;margin:10px 0;font-size:13px}
.hlkey span{display:inline-flex;align-items:center;gap:6px}
.hlkey i{width:14px;height:14px;border-radius:2px;background:var(--hl);display:inline-block}
.dots{display:flex;gap:3px;justify-content:center;min-height:6px;margin-top:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--hl)}
.years button[aria-pressed="true"] .dots i{outline:1px solid var(--paper)}
.cl{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.cl label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.cl input{margin-top:4px;flex:0 0 auto}
textarea,td input[type=text],.ctl input[type=text],.ctl select{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:2px;font:inherit}
.ctl select{width:auto} td.num input{text-align:right}
tr.cmp-diff th,tr.cmp-diff td{background:color-mix(in srgb,var(--ochre) 14%,var(--panel))}
tfoot th{font-size:14px;color:var(--ink)}
@media print{#nav,.ctl,header{display:none!important}}
.empty{padding:14px;border:1px dashed var(--line);color:var(--muted)}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style></head><body>

<div class="wrap">
  <header class="mast">

      <h1>C3 <span>Corvette</span></h1>

    <p>Årsmodell for årsmodell, 1968–1982. Motorer, gir, tachometerets rødmerking, målte 0–60 mph og en kjøpsguide.</p>

  <nav class="nav" role="tablist" aria-label="Visning" id="nav"></nav>
  <main id="view"></main>
</div>

 ],
 buy:{find:["Vanligst er 327/300 med 3-trinns manuell eller Powerglide. L79 og 427-ene er mye sjeldnere.","Cabriolet (18 630) er vanligere enn coupé (9 936) dette året.","Krom støtfanger foran og bak."],

 ],

 ],

/* Endringer fra år til år: Wikipedia (Chevrolet Corvette C3), supplert med øvrige kilder. */
const CHG={
1968:[
"Helt nytt karosseri og interiør. Coupéen er en notchback med nesten vertikal, avtakbar bakrute og avtakbare T-top-paneler (stropper og vinylposer til panelene følger med, og det er et oppbevaringsbrett bak). Cabriolet har oppfellbart kalesje, og en hardtop med glassrute er ekstrautstyr.",
"Skjulte frontlykter og skjulte vindusviskere, begge vakuumstyrt. Wikipedia kaller viskerluken problematisk. Utvendige dørhåndtak ligger flush og har egen utløserknapp. Frontskjermene har funksjonelle kjøleluftåpninger. Ventilasjonsvinduene i dørene er borte til fordel for «Astro Ventilation».",
"Interiør: store runde speedometer og tachometer, med hjelpeinstrumenter for oljetrykk, vanntemperatur, amperemeter, drivstoff og analog klokke. Et fiberoptisk panel overvåker utvendig lys. Det er ikke hanskerom, og batteriet er flyttet bak setene.",
"Nytt ekstrautstyr: varmetråd i bakruten, tyverialarm, blanke hjuldeksler og AM/FM-stereo.",
"Understellet er overført fra C2: uavhengig opphengning og skivebremser på alle fire hjul.",
"Motorer: base L30 327 (300 hk @ 5000, 360 lb-ft @ 3400, 10,0:1) og L79 327 (350 hk @ 5800). Big block 427 utgjør nesten halvparten av produksjonen: L36 390 hk (firespjelds), L68 400 hk (tri-power), L71 435 hk (tri-power, 11,0:1, 460 lb-ft @ 4000), L89 (L71 med aluminiumshoder) og L88 (oppgitt 430 hk, race-motor med aluminiumshoder, 12,5:1, 485 lb-ft @ 4000).",
"Girkasser: 3-trinns Turbo Hydra-Matic (M40) erstatter 2-trinns Powerglide. Manuelt finnes 3-trinns (bare noen hundre solgt), 4-trinns M20 (vid), M21 (tett) og M22 «Rock Crusher».",
"Hjul: 7 tommer brede stålfelger med F70×15 diagonaldekk. Hvite eller røde striper var valgfritt.",
"Panser: lav profil på småblokk. Big block har hevet panser med to blinde luftinntak og «427»-merker.",
"Sjeldne valg: L88 (80 biler), J56 kraftige bremser (81), UA6 alarm (388), L89 aluminiumshoder (624).",
"Biler med AC: 5 664 (20 %). Bilen fikk dårlig omtale for byggekvaliteten."
],
1969:[
"Småblokka vokser fra 327 til 350 cid uten økning i hk. Base ZQ3 gir 300 hk @ 4800, 380 lb-ft og 10,25:1. L79 blir L46 (350 hk @ 5600, 11,0:1).",
"Big block L36, L68, L71 og L88 videreføres. L88 tilbys for siste gang, og ZL1 (helaluminium 427, oppgitt 430 hk) tilbys bare dette året. Wikipedia oppgir at ZL1 gikk kvartmil på 10,89 s, at tester antyder ca. 460 hk brutto (376 netto), og at Motor Trend kalte den den raskeste produksjonsbilen.",
"Hjulbredden øker fra 7 til 8 tommer. Dekk med hvite bokstaver tilbys første gang, og dekk med røde striper siste gang.",
"Syv akselutvekslinger fra 2,73 til 4,56. Standard er 3,08 med automat og 3,36 med manuell. Positraction sitter på over 95 % av bilene.",
"Utvendig: «Stingray» skrives nå som ett ord på skjermene. Dørhåndtakene åpnes med en fingerplate, så den separate utløserknappen er borte. Ryggelys i de innerste baklyktene, frontlyktspylere og helt svart grill. Sidemonterte eksosrør og pynt på skjermenes luftespalter var valgfritt, og bare dette året.",
"Interiør: nye dørpaneler gir mer skulderplass, nakkestøtter er standard, rattet krymper fra 16 til 15 tommer, tenningslåsen flyttes til rattstammen og det er kartlommer foran passasjeren.",
"Coupé utgjør 57 % av produksjonen og selger bedre enn cabriolet for første gang. En arbeidskonflikt og forsinket 1970-lansering forlenget modellåret til desember 1969.",
"Apollo 12: tre gull-og-svarte Stingray ble leid ut for 1 USD i året til astronautene Conrad, Gordon og Bean.",
"Sjeldne valg: ZL1 (2 biler), J56 (115), L88 (116), L89 (390). Wikipedia nevner at en 1969 L88 Lightweight ble solgt for 2 860 000 USD i 2014 (dyreste C3), og at en av de to fabrikk-ZL1 ble solgt for 3 140 000 USD i 2023.",
"Biler med AC: 11 859 (31 %). Produksjonstallet varierer mellom kildene: 38 762 hos Corvette Action Center mot 38 462 på Wikipedia."
],
1970:[
"Produksjonen startet i januar 1970 (lansert februar, sammen med andre generasjon Camaro) med fenderflares, ny «egg-crate»-grill og tilsvarende luftespalter i skjermene, større firkantede blinklys foran og større rektangulære eksosutløp.",
"Interiør: nye seter og et nytt deluxe-valg (custom interior) med trepaneler, bedre teppe, skinn på sitteflatene og teppebelagte nedre dørpaneler. Standard er Positraction, tonet glass og vid 4-trinns manuell.",
"Motorer: base ZQ3 350 (300 hk), L46 (350 hk) og to nye. LT1 gir 370 hk @ 6000 og 380 lb-ft @ 4000, med 11:1, solide løftere, smidd stålveivaksel, firebolts hovedlagre, kam med høy løft, aluminiumsinntak og finnede aluminium ventildeksler. Under 8 % av produksjonen, ikke med AC, og med hevet panser og LT1-dekor. Motor Trend målte 14,36 s kvartmil @ 101,69 mph.",
"LS5 454 gir 390 hk @ 4800 og 500 lb-ft @ 3400 og ble valgt på ca. en fjerdedel av bilene. LS7 454 (460 hk @ 5600, 490 lb-ft) sto i Chevrolet-litteraturen og ble tilbudt som boksmotor, men antas ikke solgt til sluttkunder.",
"Girkasser: 3-trinns manuell droppes og 4-trinns manuell blir standard. Wikipedia sier at Turbo Hydra-Matic var gratis på alle motorer unntatt LT1. Andre kilder oppgir at L46 heller ikke fantes med automat.",
"ZR1-pakke (ny): 1 221 USD, bare med LT1. Racing-understell, kraftige bremser, stabilisatorer og annet. Kan ikke kombineres med elektriske vinduer, servostyring, AC, bakrute-defogger, hjuldeksler eller radio.",
"Sjeldne valg: ZR1 (25 biler), skulderbelter i cabriolet (475), LT1 (1 287). Alle hk-tall for 1968–70 er SAE brutto.",
"Biler med AC: 6 659 (38 %). Produksjonen falt nesten 60 % på grunn av det korte modellåret."
],
1971:[
"Nesten identisk med 1970, ute og inne. Fiberoptisk overvåkning, frontlyktspylere og M22 4-trinns er borte ifølge Wikipedia (Car and Driver testet likevel en LS6 med M22).",
"AC bestilles nå på de fleste bilene, ca. 53 %.",
"Lavere kompresjon for lavoktan blyfri bensin. Effekttapet var 30–40 hk, men med brutto-mot-netto-tall ser det ut som 90–105 hk lavere, avhengig av motor.",
"Motorer (brutto / netto): base 350 270/210 hk, 360/300 lb-ft, 8,5:1. LT1 330/275 hk, 360/300 lb-ft, 9,0:1. LS5 365/285 hk, 465/390 lb-ft, 8,5:1. LS6 (bare 1971) 425/325 hk, 475/390 lb-ft, 9,0:1 med aluminiumshoder, kunne fås med automat og var høyest rangert i 1970–72.",
"ZR1 videreføres for LT1. ZR2 (bare 1971) kostet 1 747 USD for LS6, inkluderte ZR1-utstyr og krevde 4-trinns manuell. Bare 12 biler fikk den (2 cabrioleter), av 188 LS6.",
"Sjeldne valg: ZR1 (8), ZR2 (12), LS6 (188), skulderbelter i cabriolet (677).",
"Biler med AC: 11 481 (53 %)."
],
1972:[
"Siste år for krom støtfanger foran og bak, den vakuumstyrte viskerluken og den avtakbare bakruten på alle coupéer i 1968–72. Nøkkelstyrt tyverialarm blir standard.",
"Automat sitter på de fleste biler for første gang, ca. 54 %.",
"Effekt oppgis nå som SAE netto. Base 350: 200 hk @ 4400, 300 lb-ft @ 2800, 8,5:1.",
"LT1: 255 hk @ 5600, 280 lb-ft @ 4000, 9,0:1. Siste år for LT1 og ZR1-pakken, og nå kan LT1 ha AC. LS5 454: 270 hk @ 4000, 390 lb-ft @ 3200, 8,5:1, ikke i California.",
"M22 er ikke lenger vanlig produksjonsvalg, men monteres fortsatt på ZR1. Chevrolet begynte å begrense noen drivlinjer til California på grunn av strengere utslippskrav.",
"Cabriolet solgte 6 508, ca. 9 % av markedet og nr. 3 i sin klasse (Cutlass Supreme 11 571, Impala 6 456, Mustang 6 401).",
"Sjeldne valg: ZR1 (20), skulderbelter i cabriolet (749), LT1 (1 741).",
"Biler med AC: 17 011 (63 %)."
],
1973:[
"Ny lett 5 mph-støtfanger foran: et tverrgående innerrør på to Omark-bolter under et støpt urethan-trekk (+35 lb). Den kromede bakre støtfangeren videreføres.",
"Radialdekk er standard (GR70-15, hvite striper eller hvite bokstaver valgfritt), karosseriet har gummifester og støyen i kupeen er redusert med 40 %.",
"Fronten får grill i pressstøpt metall (svart med sølvkant), nye luftekanaler i skjermene, rundt nese-emblem og isolasjon under panseret. Nytt panser med luftinntak bak, som skal ha kuttet 0–60 med ca. ett sekund.",
"Motorer: L48 190 hk @ 4400, 270 lb-ft @ 2800, 8,5:1. L82 (erstatter LT1) 250 hk @ 5200, 285 lb-ft @ 4000, 9,0:1, valgt på nesten 20 % til 299 USD. LS4 454 (erstatter LS5) 275 hk @ 4400, 395 lb-ft @ 2800, 8,25:1, valgt på 15 %. Noen kilder oppgir 270 hk for LS4.",
"Z07 off-road-pakken introduseres (45 biler). Aluminiumsfelger satt på prøvebiler og noen få 1973-er, men ble holdt tilbake av kvalitetsgrunner til 1976.",
"Biler med AC: 21 578 (71 %)."
],
1974:[
"Ny bakre støtfanger: avsmalnende urethan-trekk med integrert skiltholder, utsparinger for runde baklys og en aluminiumsbjelke på to Omark-braketter (5 mph). Bare i 1974 har trekket en vertikal søm i midten.",
"Alarmens nøkkelaktivator flyttes fra bakpanelet til venstre frontskjerm. Eksosrørene peker nedover uten forlengelse, dobbel eksos får resonatorer, og kjøler og skjerm er revidert for kjøling i lav fart. Det innvendige speilet er bredere (8 til 10 tommer). Hofte- og skulderbelte er integrert (bare coupé), grillen er aluminium og helt svart, og tanklokket har ikke emblem.",
"FE7 Gymkhana-understell (stivere fjærer og stivere frontstabilisator) uten bestillingsbegrensninger. Z07-pakken (400 USD) inkluderer FE7 og kraftige servobremser, og fantes bare på L82 og LS4 med M21.",
"Motorer: L48 195 hk @ 4400, 275 lb-ft @ 2800. L82 250 hk @ 5200, 285 lb-ft @ 4000. LS4 270 hk @ 4400 (ned fra 275), 380 lb-ft @ 2800, 8,25:1. Wikipedia oppgir 0–60 på 6,8 s for L48.",
"Siste år for ekte dobbel eksos (for biler uten katalysator) og for big block."
],
1975:[
"Første år med katalysator og elektronisk tenning. Drivstoffmåler og tanklokk er merket «unleaded fuel only». Dobbel eksos slås sammen til én katalysator og deles igjen til to lyddempere og endestykker.",
"Elektronisk tachometer, og speedometeret får km/h-subskala. Reviderte indre støtfangersystemer med støpte støtfangerhorn, ett-delt sømløst urethan-trekk bak, svartlakkerte støtfangerlister og helt svart plastgrill. Ravgule parkeringslys erstatter klare.",
"Cross-flag-emblemer introduseres, og Astro Ventilation avvikles. Serviceintervallene er forlenget, og bilen ble markedsført som «en mer effektiv Corvette».",
"Motorer: L48 165 hk @ 3800 (lavest for noen V8-Corvette), 255 lb-ft @ 2400, 8,5:1. L82 205 hk @ 4800 (ned 45 hk), 255 lb-ft @ 3600, 9,0:1. L82-emblem på panseret fordi det ikke finnes noen større motor. Akselutvekslingene er uendret: 3,08 (automat) og 3,36 (manuell). Siste år for L82 i California-biler.",
"Siste cabriolet frem til 1986 (12 % av bilene). Kalesje er standard, og hardtop i karosserifarge eller vinyl er valgfritt. Car and Driver målte 7,7 s 0–60 på en base med automat."
],
1976:[
"Stålgulv erstatter fiberglass. Det skjermer katalysatoren, er lettere og gir mindre støy i kupeen. Cowl-induction er droppet: luftrenseren henter uteluft fra fronten gjennom kanaler over kjøleren, og luftespalten i panseret er uten funksjon.",
"Støpte aluminiumsfelger er endelig tilgjengelige og reduserer uavfjæret vekt med 32 lb. Ca. 15 % bestilte dem (299 USD).",
"Siste år for dekk med hvite striper (86 % hadde hvite bokstaver). Ett-delt «Corvette»-navneskilt bak erstatter enkeltbokstavene. Siste år for «Stingray»-navnet på skjermene.",
"Nytt «Vega GT» firekjefta ratt (upopulært, men gir mer plass), vedlikeholdsfritt «Freedom»-batteri i alle biler og bakrute-defogger som varmeelement i glasset («Electro-Clear»).",
"Motorer: L48 180 hk @ 4000 (opp fra 165), 270 lb-ft @ 2400. L82 210 hk @ 5200, 255 lb-ft @ 3600. Car and Driver målte 6,8 s 0–60 for både L48 og L82 med 4-trinns."
],
1977:[
"Rattstammen er flyttet 2 tommer nærmere dashbordet. Custom interior med skinn er standard, og tekstil og skinn fås uten tillegg. Ny konsoll tar universelle Delco-radioer (8-track mulig), hjelpeinstrumentene er restylet og voltmeter erstatter amperemeter. Soldeksler kan svinges til siden.",
"Nytt treekers skinnratt er standard med tilt-teleskop-stamme. Servostyring og servobremser er standard.",
"Nytt ekstrautstyr: lakkerte sportsspeil, cruisekontroll (bare automat) og en convenience-pakke (forsinket kupélys, frontlys-varsler, lys under panseret, varsellys for lite drivstoff, courtesy-lys og speil i passasjerens solskjerm).",
"Sort lakk er tilbake (sist i 1969). Motorlakken skiftet fra Chevy orange til Corporate blue tidlig i produksjonen. Stingray-skriften er droppet, og nye cross-flag-emblemer sitter på skjermene. Frontrutestolpene er lakkert svarte.",
"Siste år for sugar-scoop-taklinjen og den vertikale bakruten.",
"Effekt uendret: base 180 hk, L82 210 hk. Corvette-produksjonen passerte en halv million siden 1953."
],
1978:[
"Silver Anniversary (25 år): jubileumsemblemer på nese og tanklokk. B2Z-pakken (399 USD) ga tofarget lakk, sølv over grå underdel med pinstripe, og krevde aluminiumsfelger og to sportsspeil (+380 USD).",
"Indy 500 Pace Car-replika (Z78): 6 502 bygget, svart over sølv med rød pinstripe, for- og bakspoiler, speiltonede takpaneler og profilerte sportsseter med sølvfarget skinn.",
"Ny fastback-bakrute i fast glass erstatter sugar-scoop-bakruten. Det gir mer bagasjeplass og bedre sikt, og følger med en solskjerm.",
"Interiør i «flycockpit»-stil med ny instrumentpanel og konsoll samt nye dørpaneler. Hanskerom erstatter kartlommene på passasjersiden.",
"Nytt ekstrautstyr: sentrallås, elektrisk antenne, to bakhøyttalere og CB-radio. Convenience-gruppen inkluderer intervallviskere, gulvmatter og belyst vanity-speil.",
"Motorer: L48 185 hk (175 i California og i høyden). L82 220 hk, med dual-snorkel luftinntak og et aluminiumsinntak som sparer 24 lb. Kromskjermen over tenningen er erstattet av en metallforet svart plastdeksel.",
"Dekk: metriske P225/70R15 er standard, og bredere P255/60R15 er valgfritt (krever at skjermene beskjæres). Drivstofftanken vokser fra 17 til 24 gal, og reservehjulet blir et lite P195/80D15 nødhjul.",
"Ytelse: L48 med automat 0–60 på 7,8 s og 123 mph topphastighet. Road & Track-testen av L82 oppgis med 6,6 s, 127 mph og 15,3 s @ 95 mph på kvartmil."
],
1979:[
"Rekordår med 53 807 bygget, fortsatt rekord. Cross-flag på nese og tanklokk er tilbake til 1977-designen.",
"Nye lette høyrygg-seter er standard, med bedre sidestøtte, lettere adkomst til bagasjen og ca. 24 lb lavere vekt for paret.",
"Spoilere (valgfritt, nesten 7 000 biler) kutter luftmotstanden med ca. 15 % og forbedrer forbruket med ca. en halv mile per gallon. Glass-T-tops i speiltonet glass (365 USD) ble valgt på nesten 15 000 biler, og alle T-tops er nå koblet til alarmen.",
"Standard: halogen-fjernlys og AM/FM-radio. Kassettspiller kostet 234 USD. Kraftige støtdempere kan bestilles uten full Gymkhana, og L82 med AC får en ekstra elektrisk vifte. Dørterskler og bakrutelist er lakkert svarte.",
"Motorer: nye «open flow»-lyddempere løfter effekten på alle motorer, til 195 hk for L48 og 225 hk for L82. Moment: L48 280 lb-ft @ 2400 (8,2:1) og L82 270 lb-ft @ 3600 (8,9:1).",
"L82 kan bestilles med manuell for siste gang, og M21 tett 4-trinns avsluttes. En vid 4-trinns er tilgjengelig på alle. Under 20 % av bilene hadde manuell, mot ca. 82 % i 1968."
],
1980:[
"Restylte støtfangertrekk foran og bak med integrerte spoilere, som gir lavere luftmotstand og mer luft til kjøleren. Nytt panser. Cross-flags på frontskjermene er fjernet, og flaggene på nese og tanklokk er gjort mer langstrakte. L82-emblemet flyttes fra panseret til frontskjermene.",
"L82 avsluttes (230 hk) og kan ikke lenger kombineres med manuell, fordi manuell bare fantes med L48. Speedometeret viser maks 85 mph (føderalt krav).",
"Standard: AC, tilt-teleskop-rattstamme, elektriske vinduer, sportsspeil og convenience-pakke. Nytt valg: takpanelbærer som monteres på bakdekket.",
"Vektreduksjon: tynnere karosseripaneler, en aluminiums Dana 44 IRS-differensial med krysspanel i stedet for den støpejerns 10-bolts, og aluminiumsinntak og aluminiums generatorbrakett på alle biler.",
"California 305 (LG4): 180 hk, rustfrie 409-eksosgrenrør, bare automat og datastyrt forgasser og tenning. Kunder fikk 50 USD i kreditt, men betalte 250 USD for utslippssertifisering. Utenfor California: L48 190 hk, 280 lb-ft @ 2400, 8,2:1.",
"Prisen er oppgitt ulikt i kilden: 13 140 USD i tabellen, mens teksten sier at den steg fire ganger i løpet av året til 14 345 USD."
],

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const li=a=>`<ul class="l">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
const fmt=v=>String(v).replace(".",",");
const tcls=t=>t==="M"?"man":t==="A"?"aut":"unk";
const tlab=t=>t==="M"?"Manuell":t==="A"?"Automat":"Gir ikke oppgitt";
const pill=t=>`<span class="pill ${tcls(t)}">${tlab(t)}</span>`;
function tach(v,alt){
  if(!v) return `<span class="sub">ikke verifisert</span>`;
  const a=alt?`<span class="sub">${alt.v} ${esc(alt.l)}</span>`:"";
  return `<span class="rpm">${v}</span><span class="tach" style="--p:${(v/7000*100).toFixed(1)}%" title="Rødmerking starter på ${v} o/min"></span>${a}`;
}

function viewEngines(){
  const q=state.q.trim().toLowerCase();
  let rows=allRows().filter(r=>!q||[r.y,r.c,r.n,r.hp,r.tr,r.no].join(" ").toLowerCase().includes(q));
  let body="";
  if(state.mode==="aar"){
    body=`<div class="scroll"><table><thead><tr><th>År</th><th>Motor</th><th class="num">Hk</th><th class="num">Moment (lb-ft @ o/min)</th><th>Tach rødmerking</th><th>Gir</th><th>AC</th><th>Merknad</th></tr></thead><tbody>${
      rows.map(r=>`<tr${hlCls(r.y,r.c)}><td class="num">${r.y}</td><td><span class="code">${esc(r.c)}</span><span class="sub">${esc(r.n)}</span></td><td class="num">${esc(r.hp)}<span class="sub">${r.r==="B"?"brutto":"netto"}</span>${netHp(r.y,r.c)}</td><td class="num">${tq(r.y,r.c)}${netTq(r.y,r.c)}</td><td>${tach(r.t,r.ta)}</td><td>${esc(r.tr)}</td><td>${esc(r.ac)}</td><td>${esc(r.no)}</td></tr>`).join("")
    }</tbody></table></div>`;
  } else {
    const g={};
    rows.forEach(r=>{(g[r.c]=g[r.c]||[]).push(r)});
    body=`<div class="scroll"><table><thead><tr><th>Motorkode</th><th>Cid</th><th>År og hk</th></tr></thead><tbody>${
      Object.keys(g).map(k=>`<tr${HLC[k]?` class="hl-${HLC[k]}"`:""}><td><span class="code">${esc(k)}</span></td><td>${esc(g[k][0].n)}</td><td>${g[k].map(r=>`<span class="rpm"${k==="L82"&&r.y===1973?' style="background:color-mix(in srgb,var(--hl-82) 25%,transparent);padding:0 4px"':""}>${r.y}: ${esc(r.hp)} hk${r.y===1971&&NET71[r.c]?" brutto / "+NET71[r.c][0][0]+" netto":""}, ${esc(tqtxt(r.y,r.c))}${r.y===1971&&NET71[r.c]?" brutto / "+NET71[r.c][1][0]+" lb-ft netto":""}</span>`).join("<br>")}</td></tr>`).join("")
    }</tbody></table></div>`;
  }
  return `
  <section class="blk"><h3>Alle motorer <small>${rows.length} rader</small></h3>${HLKEY}
  <div class="ctl"><input type="search" id="q" placeholder="Søk: L82, 454, automat, 1973…" value="${esc(state.q)}" aria-label="Søk i motorer">
    <div class="seg"><button data-mode="aar" aria-pressed="${state.mode==="aar"}">Per år</button><button data-mode="kode" aria-pressed="${state.mode==="kode"}">Per motorkode</button></div></div>
  ${body}
  <div class="note"><b>Hk-tall</b><br>1968–71 er SAE brutto, fra 1972 SAE netto. Tallene kan ikke sammenlignes direkte mellom disse periodene. Moment er trolig oppgitt brutto til og med 1971 og netto fra 1972, men kildene sier det ikke eksplisitt.</div></section>`;
}

function viewTimes(){
  let t=T.slice();
  if(state.tfilter==="M") t=t.filter(x=>x.t==="M");
  if(state.tfilter==="A") t=t.filter(x=>x.t==="A");
  t.sort((a,b)=>a.s-b.s);
  const max=9;
  const bars=t.map(x=>`<div class="bar"><div class="lab">${x.y} ${esc(x.e)}<small>${esc(x.hp)} hk · ${esc(x.src)}</small></div><div class="tr"><div class="fl ${tcls(x.t)}" style="width:${(x.s/max*100).toFixed(1)}%"></div></div><div class="v">${fmt(x.s.toFixed(1))} s</div></div>`).join("");
  return `
  <section class="blk"><h3>0–60 mph <small>${t.length} tester, raskest først</small></h3>
  <div class="ctl"><div class="seg" role="group" aria-label="Girtype">
    <button data-tf="alle" aria-pressed="${state.tfilter==="alle"}">Alle</button>
    <button data-tf="M" aria-pressed="${state.tfilter==="M"}">Manuell</button>
    <button data-tf="A" aria-pressed="${state.tfilter==="A"}">Automat</button></div>
    <span class="small"><span class="pill man">Manuell</span> hel stolpe · <span class="pill aut">Automat</span> skravert · <span class="pill unk">Gir ikke oppgitt</span> grå</span></div>
  <div class="bars">${bars}</div>
  <div class="note"><b>Les dette først</b><br>Resultatene er fra ulike tester, dekk, akselutvekslinger og år. De er ikke direkte sammenlignbare. Der kilden ikke nevner girtype står det.</div>
  <h3 style="margin-top:28px;font-size:24px">Vanlige feil i nettkilder</h3>${li(PITFALLS)}
  </section>`;
}

function viewChanges(){
  return `<section class="blk"><h3>Endringer år for år</h3><div class="tl">${
    Y.map((d,i)=>`<details ${i===0?"open":""}><summary><b>${d.y}</b><span>${esc(d.nm)}</span></summary>${li(d.chg)}</details>`).join("")
  }</div></section>`;
}

CTD:"350 cid, 300 hk, manuell",CTG:"350 cid, 300 hk, automat",CTL:"350 cid, 300 hk, manuell",CTM:"350 cid, 300 hk, automat",
CTH:"350 cid, 350 hk (L46), manuell",CTN:"350 cid, 350 hk (L46), manuell",CTJ:"350 cid, 350 hk (L46), manuell, AC",CTO:"350 cid, 350 hk (L46), manuell, AC",

CGW:"454 cid, 390 hk (LS5), automat",CRJ:"454 cid, 390 hk (LS5), automat, transistortenning",CRI:"454 cid, 390 hk (LS5), manuell, transistortenning",CZU:"454 cid, 390 hk (LS5), manuell"

const AXLE70={CAK:"3,36",CAL:"3,08",CAN:"3,55",CAP:"4,11",CAS:"3,70",CAV:"3,08",CAW:"3,08",CLR:"3,36",
CAM:"Positraction 3,36",CAO:"Positraction 3,70",CAT:"Positraction 3,08 HD",CAU:"Positraction 3,36 HD",CAX:"Positraction 3,36 HD",CAY:"Positraction 2,73 (Turbo Hydra-Matic)",CAZ:"Positraction 3,55 HD",CFA:"Positraction 3,70",CFB:"Positraction 4,11 HD",CFC:"Positraction 4,56 HD"};
function decodeVin(v){
  v=v.toUpperCase().replace(/\s/g,"");
  if(!v) return "";
  if(!/^[0-9A-Z]{13}$/.test(v)) return `<p class="small">VIN skal ha 13 tegn. Du har skrevet ${v.length}.</p>`;
  const yr={8:"1968",9:"1969","0":"1970","1":"1971"}[v[5]];
  const body={"37":"coupé (to dører)","67":"cabriolet (to dører)"}[v.slice(3,5)];
  const pl=v[6]==="S"?"St. Louis":"";
  const seq=v.slice(7);
  if(!/^194[0-9]{2}[0-9]/.test(v)||!yr) return `<p class="small">Dette ser ikke ut som en VIN i formatet for 1968–71 (for eksempel 194370S400001). Format for 1972 og senere er ikke dekket her.</p>`;
  return `<table><tbody>
   <tr><td class="code">${v[0]}</td><td>Divisjon: ${v[0]==="1"?"Chevrolet":"ukjent"}</td></tr>
   <tr><td class="code">${v.slice(1,3)}</td><td>Serie: ${v.slice(1,3)==="94"?"Corvette":"ukjent"}</td></tr>
   <tr><td class="code">${v.slice(3,5)}</td><td>Karosseri: ${body||"ukjent kode"}</td></tr>
   <tr><td class="code">${v[5]}</td><td>Årsmodell: ${yr}</td></tr>
   <tr><td class="code">${v[6]}</td><td>Fabrikk: ${pl||"ukjent kode i denne listen"}</td></tr>
   <tr><td class="code">${seq}</td><td>Produksjonsnummer</td></tr></tbody></table>
   <p class="small">Motorens stempling skal ha «VIN-derivat»: årssiffer, fabrikkbokstav og produksjonsnummer. For denne bilen: <b>${v.slice(4,7)+seq}</b> (for eksempel «70S411547» på en 1970-bil ifølge NCRS-tråden).</p>`;
}
function decodeStamp(s){
  s=s.toUpperCase().replace(/\s/g,"");
  if(!s) return "";
  const m=s.match(/^([A-Z])(\d{2})(\d{2})([A-Z]{3})$/);
  if(!m) return `<p class="small">Forventet format: én bokstav, fire sifre og tre bokstaver, for eksempel V0513CJL.</p>`;
  const mm=+m[2], dd=+m[3];
  const plant={V:"Flint, Michigan"}[m[1]];
  const date=(mm>=1&&mm<=12&&dd>=1&&dd<=31)?`${dd}.${mm}.`:"ugyldig dato";
  const suf=SUF70[m[4]];
  return `<table><tbody>
   <tr><td class="code">${m[1]}</td><td>Motorfabrikk: ${plant||"kode ikke i listen min (Flint er V ifølge kilden jeg brukte)"}</td></tr>
   <tr><td class="code">${m[2]}${m[3]}</td><td>Byggedato: ${date}</td></tr>
   <tr><td class="code">${m[4]}</td><td>Suffiks: ${suf?esc(suf)+" (1970-liste fra CorvSport)":"ikke i 1970-listen. Det kan være et annet år eller en kode som mangler her."}</td></tr></tbody></table>`;
}
function decodeAxle(a){
  a=a.toUpperCase().replace(/\s/g,"");
  if(!a) return "";
  return AXLE70[a]?`<p><b>${a}</b>: ${AXLE70[a]} (1970-liste fra CorvSport)</p>`:`<p class="small">${esc(a)} finnes ikke i 1970-listen min.</p>`;
}

   <p class="small">Kilder: NCRS-forumet (70 Corvette Matching Numbers), Corvette Action Center og CorvSport (se Kilder-fanen).</p></section>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.view){state.view=b.dataset.view;render();window.scrollTo(0,0);}
  else if(b.dataset.year){state.year=+b.dataset.year;render();}
  else if(b.dataset.go){state.year=Math.max(1968,Math.min(1982,state.year+(+b.dataset.go)));render();window.scrollTo(0,0);}
  else if(b.dataset.mode){state.mode=b.dataset.mode;render();}
  else if(b.dataset.tsub){state.tsub=b.dataset.tsub;render();}
  else if(b.dataset.clprint!==undefined){window.print();}
  else if(b.dataset.clreset!==undefined){store.set("cl:"+toolsClYear(),{});render();}
  else if(b.dataset.cmpreset!==undefined){store.set("cmpA",{});store.set("cmpB",{});render();}
  else if(b.dataset.costreset!==undefined){store.set("cost",{});render();}
  else if(b.dataset.msub){state.msub=b.dataset.msub;render();}
  else if(b.dataset.tf){state.tfilter=b.dataset.tf;render();}
});
document.addEventListener("change",e=>{

    const items=clItems(y),n=items.filter(x=>d[x.id]).length,c=$("#clcount");if(c)c.textContent=n+" av "+items.length+" avkrysset";}

});

  const t=e.target, ds=t.dataset||{};
  if(ds.dec){const o={vin:decodeVin,stamp:decodeStamp,axle:decodeAxle}[ds.dec](t.value);$("#dec-"+ds.dec).innerHTML=o;return;}
  if(ds.clnotes!==undefined){store.set("clnotes:"+toolsClYear(),t.value);return;}
  if(ds.cmp){const [w,i]=ds.cmp.split(":"),k="cmp"+w,o=store.get(k,{});o[i]=t.value;store.set(k,o);
    const A=store.get("cmpA",{}),B=store.get("cmpB",{}),a=(A[i]||"").trim(),b=(B[i]||"").trim();
    t.closest("tr").classList.toggle("cmp-diff",!!(a&&b&&a.toLowerCase()!==b.toLowerCase()));return;}
  if(ds.cost!==undefined){const o=store.get("cost",{});o[ds.cost]=t.value;store.set("cost",o);
    const s=COST_ITEMS.reduce((x,_,i)=>x+(+String(o[i]||"").replace(/\s/g,"").replace(",",".")||0),0);$("#costsum").textContent=Math.round(s).toLocaleString("nb-NO");return;}
  if(t.id==="q"){state.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos);}
});

(function init(){
  let h=""; try{h=location.hash.replace("#","");}catch(e){}
  if(/^19(6[89]|7\d|8[0-2])$/.test(h)){state.year=+h;state.view="aar";}
  else if(["motorer","tid","endringer","vedlikehold","verktoy","kilder"].includes(h)) state.view=h;
  $("#stats").innerHTML=`<span>${Y.length} årsmodeller</span><span>${allRows().length} motorvarianter</span><span>${T.length} 0–60-tester</span>`;
  render();
})();
</script>
</body></html>
